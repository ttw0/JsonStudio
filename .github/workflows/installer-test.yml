name: Installer tests

on:
  push:
    branches: [main, master]
    paths: ['docs/install.*', 'packages/installer/**', 'scripts/generate-install-checksums.mjs', 'tests/installer.test.js', '.github/workflows/*installer*']
  pull_request:
    paths: ['docs/install.*', 'packages/installer/**', 'scripts/generate-install-checksums.mjs', 'tests/installer.test.js', '.github/workflows/*installer*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Test installer and release checksums
        run: node --test tests/installer.test.js
      - name: Check shell syntax
        if: runner.os != 'Windows'
        run: sh -n docs/install.sh
      - name: Check PowerShell syntax
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            "$PWD/docs/install.ps1", [ref]$tokens, [ref]$errors
          ) | Out-Null
          if ($errors.Count) { $errors | Format-List; exit 1 }
      - name: Verify npm package contents
        working-directory: packages/installer
        run: npm pack --dry-run
